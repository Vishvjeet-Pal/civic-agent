services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - IMAGE_STORE_PATH=/images
    depends_on:
      - postgres
      - redis
    volumes:
      - ./app:/app/app
      - imagedata:/images
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach LM Studio on host machine

  perception_worker:
    build: .
    command: ["python", "-m", "app.workers.perception_worker"]
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - IMAGE_STORE_PATH=/images
    depends_on:
      - postgres
      - redis
    volumes:
      - ./app:/app/app
      - imagedata:/images
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach LM Studio on host machine
  
  knowledge_worker:
    build: .
    command: ["python", "-m", "app.workers.knowledge_worker"]
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - IMAGE_STORE_PATH=/images
    depends_on:
      - postgres
      - redis
    volumes:
      - ./app:/app/app
      - chroma_data:/app/chroma_db
      - ./municipal_docs:/app/municipal_docs:ro

  action_worker:
    build: .
    command: ["python", "-m", "app.workers.action_worker"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis: 
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./municipal_docs:/app/municipal_docs:ro  # Add this line
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    networks:
      default:
        aliases:
          - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks:
      default:
        aliases:
          - redis
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  imagedata:
  chroma_data: